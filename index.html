<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Bonfire - 数字篝火</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030508;
            --bg-center: #0a0e14;
            --fire-inner: #fff7e6;
            --fire-mid: #ffaa00;
            --fire-outer: #ff5500;
            --fire-glow: #ff3300;
            --accent-logic: #00d4ff;
            --accent-creative: #ff6b35;
            --accent-inspiration: #a855f7;
            --accent-order: #22c55e;
            --accent-practice: #f59e0b;
            --text-primary: rgba(255, 255, 255, 0.9);
            --text-secondary: rgba(255, 255, 255, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(ellipse at 50% 120%, #1a0a00 0%, var(--bg-center) 30%, var(--bg-deep) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
            position: relative;
        }

        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
            background: radial-gradient(ellipse at 50% 0%, rgba(30, 20, 50, 0.3) 0%, transparent 60%);
        }

        .star {
            position: absolute; background: white; border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            box-shadow: 0 0 3px white;
        }

        @keyframes twinkle {
            0%, 100% { opacity: var(--base-opacity); transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .header {
            position: absolute; top: 20px; text-align: center; z-index: 100; pointer-events: none;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif; font-size: 1.8rem; font-weight: 700;
            letter-spacing: 8px; color: var(--text-primary);
            text-shadow: 0 0 30px rgba(255, 170, 0, 0.5), 0 0 60px rgba(255, 85, 0, 0.3);
        }

        .header .subtitle { font-size: 0.7rem; color: var(--accent-logic); letter-spacing: 3px; opacity: 0.8; }

        /* ======== 恒定火焰 - 大小固定 ======== */
        .fire-container {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: all 0.5s ease;
        }

        .flame {
            position: absolute;
            bottom: 20px;
            left: 50%;
            width: 50px;
            height: 50px;
            background: #ff5e00;
            border-radius: 50% 0 50% 50%;
            transform: translateX(-50%) rotate(-45deg);
            filter: blur(4px) contrast(1.5);
            box-shadow:
                0 0 20px #ff5e00,
                0 0 40px #ff5e00,
                0 0 10px #fefcc9 inset;
            animation: burn 0.2s infinite alternate;
        }

        @keyframes burn {
            from { transform: translateX(-50%) rotate(-45deg) scale(1); }
            to { transform: translateX(-50%) rotate(-45deg) scale(1.1) skew(3deg, 3deg); }
        }

        /* ======== 专注模式火焰放大 ======== */
        body.focusing .fire-container {
            transform: translate(-50%, -50%) scale(1.8);
        }

        body.focusing .flame {
            width: 80px !important;
            height: 80px !important;
            box-shadow:
                0 0 40px #ff5e00,
                0 0 80px #ff5e00,
                0 0 120px #ffaa00,
                0 0 20px #fefcc9 inset !important;
        }

        /* ======== 中央按钮区域 ======== */
        .central-area {
            position: fixed;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* 倒计时显示 */
        .timer-overlay {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            color: #ffaa00;
            text-shadow: 0 0 20px rgba(255, 170, 0, 0.8);
            display: none;
        }

        .timer-overlay.visible {
            display: block;
        }

        .focus-btn {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 18px 50px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(255, 107, 53, 0.4);
            font-family: 'Noto Sans SC', sans-serif;
        }

        .focus-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 30px rgba(255, 107, 53, 0.5);
        }

        .focus-btn.stop {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
        }

        .focus-hint {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            display: none;
        }

        .focus-hint.visible {
            display: block;
        }

        /* ======== 右侧面板 ======== */
        .right-panel {
            position: fixed;
            right: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: linear-gradient(180deg, rgba(20, 20, 35, 0.95) 0%, rgba(10, 10, 20, 0.98) 100%);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 100;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .right-panel.collapsed {
            transform: translateX(240px);
        }

        .panel-toggle {
            position: absolute;
            left: -30px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 8px 0 0 8px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .panel-section {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .panel-section.time-setting {
            background: rgba(255, 165, 0, 0.08);
        }

        .panel-section.campers-list {
            flex: 1;
            overflow-y: auto;
            background: rgba(168, 85, 247, 0.05);
        }

        .panel-title {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .duration-input {
            width: 60px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 1.2rem;
            text-align: center;
            padding: 8px;
        }

        .duration-input:focus {
            outline: none;
            border-color: rgba(255, 165, 0, 0.6);
        }

        .preset-btns {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .preset-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
            padding: 8px;
            cursor: pointer;
        }

        .preset-btn:hover {
            background: rgba(255, 165, 0, 0.2);
            border-color: rgba(255, 165, 0, 0.5);
        }

        .camper-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .camper-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .camper-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: white;
            font-weight: bold;
        }

        .camper-name {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .camper-name.focusing {
            color: #ffaa00;
            font-weight: bold;
        }

        .camper-status {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
        }

        .camper-status.focusing {
            color: #ffaa00;
        }

        /* ======== 左侧面板 ======== */
        .left-panel {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            z-index: 100;
            background: linear-gradient(180deg, rgba(20, 20, 35, 0.95) 0%, rgba(10, 10, 20, 0.98) 100%);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 100;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .left-panel.collapsed {
            transform: translateX(-240px);
        }

        .left-toggle {
            position: absolute;
            right: -30px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 0 8px 8px 0;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
        }

        .user-info {
            padding: 20px;
            background: rgba(255, 165, 0, 0.1);
            border-bottom: 1px solid rgba(255, 165, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
        }

        .user-name {
            font-size: 1.1rem;
            color: white;
            font-weight: bold;
        }

        .user-mbti {
            font-size: 0.85rem;
            color: #ffaa00;
        }

        .logs-section {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .log-item {
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .log-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .log-time {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
        }

        .log-preview {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 5px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ======== 故事弹窗 ======== */
        .story-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .story-modal.visible {
            display: flex;
        }

        .story-content {
            background: rgba(20, 20, 35, 0.95);
            padding: 30px;
            border-radius: 16px;
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(255, 170, 0, 0.3);
        }

        .story-title {
            font-size: 1.2rem;
            color: #ffaa00;
            margin-bottom: 20px;
        }

        .story-text {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.8;
            font-style: italic;
        }

        .story-close {
            margin-top: 20px;
            padding: 10px 30px;
            background: #ff6b35;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }

        /* ======== Loading ======== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-overlay.visible {
            display: flex;
        }

        .loading-content {
            text-align: center;
            color: white;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #ffaa00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ======== 专注模式隐藏 ======== */
        body.focusing .left-panel,
        body.focusing .right-panel,
        body.focusing .header {
            opacity: 0;
            pointer-events: none;
        }

        /* ======== 登录界面 ======== */
        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .login-screen.hidden {
            display: none;
        }

        .login-box {
            text-align: center;
        }

        .login-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: #ffaa00;
            margin-bottom: 20px;
        }

        .login-btn {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 1.2rem;
            padding: 15px 40px;
            cursor: pointer;
        }

        /* ======== 动作选择弹窗 ======== */
        .action-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .action-modal.visible {
            display: flex;
        }

        .action-content {
            background: rgba(20, 20, 35, 0.95);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
        }

        .action-title {
            color: #ffaa00;
            margin-bottom: 20px;
        }

        .action-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 15px 20px;
            color: white;
            cursor: pointer;
            font-size: 1rem;
        }

        .action-btn:hover {
            background: rgba(255, 165, 0, 0.2);
            border-color: rgba(255, 165, 0, 0.5);
        }

        @media (max-width: 768px) {
            .right-panel, .left-panel {
                width: 260px;
                transform: translateX(100%);
            }
            .right-panel.expanded, .left-panel.expanded {
                transform: translateX(0);
            }
            .focus-btn {
                font-size: 1.2rem;
                padding: 14px 30px;
            }
            .timer-overlay {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- 星空背景 -->
    <div class="stars" id="stars"></div>

    <!-- 登录界面 -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h1 class="login-title">数字篝火</h1>
            <p style="color:rgba(255,255,255,0.6);margin-bottom:30px;">深夜里的每一团火，都是为了等待一个同频率的灵魂</p>
            <button class="login-btn" onclick="goLogin()">进入篝火</button>
        </div>
    </div>

    <!-- 标题 -->
    <div class="header">
        <h1>DIGITAL BONFIRE</h1>
        <p class="subtitle">数字篝火</p>
    </div>

    <!-- 火焰容器 -->
    <div class="fire-container" id="fireContainer">
        <div class="flame"></div>
    </div>

    <!-- 中央区域：倒计时 + 按钮 -->
    <div class="central-area">
        <div class="timer-overlay" id="timerOverlay">00:00</div>
        <button class="focus-btn" id="mainFocusBtn" onclick="handleFocusClick()">开始专注</button>
        <div class="focus-hint" id="focusHint">你的 Agent 正在 🍢 烤棉花糖...</div>
    </div>

    <!-- 左侧面板：个人信息 + 日志 -->
    <div class="left-panel" id="leftPanel">
        <button class="left-toggle" onclick="toggleLeftPanel()">◀</button>
        <div class="user-info">
            <div class="user-avatar" id="userAvatar">?</div>
            <div>
                <div class="user-name" id="userName">未登录</div>
                <div class="user-mbti" id="userMbti">---</div>
            </div>
        </div>
        <div class="logs-section">
            <div class="panel-title">📜 分身日志</div>
            <div id="logsList">
                <div style="color:rgba(255,255,255,0.4);font-size:0.8rem;text-align:center;padding:20px;">暂无故事</div>
            </div>
        </div>
    </div>

    <!-- 右侧面板：时间设置 + 营员名录 -->
    <div class="right-panel" id="rightPanel">
        <button class="panel-toggle" onclick="toggleRightPanel()">▶</button>

        <!-- 时间设置 -->
        <div class="panel-section time-setting">
            <div class="panel-title">⏱️ 专注时长</div>
            <div style="display:flex;align-items:center;gap:8px;">
                <input type="number" id="durationInput" class="duration-input" value="25" min="1" max="180">
                <span style="color:rgba(255,255,255,0.6)">分钟</span>
            </div>
            <div class="preset-btns">
                <button class="preset-btn" onclick="setDuration(15)">15分钟</button>
                <button class="preset-btn" onclick="setDuration(25)">25分钟</button>
                <button class="preset-btn" onclick="setDuration(45)">45分钟</button>
                <button class="preset-btn" onclick="setDuration(60)">60分钟</button>
            </div>
        </div>

        <!-- 营员名录 -->
        <div class="panel-section campers-list">
            <div class="panel-title">🔥 在线营员</div>
            <div id="campersList">
                <div style="color:rgba(255,255,255,0.4);font-size:0.8rem;text-align:center;padding:20px;">暂无营员</div>
            </div>
        </div>
    </div>

    <!-- 动作选择弹窗 -->
    <div class="action-modal" id="actionModal">
        <div class="action-content">
            <h2 class="action-title">🎭 选择专注动作</h2>
            <div class="action-btns">
                <button class="action-btn" onclick="selectAction('烤棉花糖', '🍢')">🍢 烤棉花糖</button>
                <button class="action-btn" onclick="selectAction('湖边钓鱼', '🎣')">🎣 湖边钓鱼</button>
                <button class="action-btn" onclick="selectAction('翻阅古籍', '📖')">📖 翻阅古籍</button>
                <button class="action-btn" onclick="selectAction('拨弄琴弦', '🎸')">🎸 拨弄琴弦</button>
                <button class="action-btn" onclick="selectAction('仰望星空', '🌌')">🌌 仰望星空</button>
            </div>
        </div>
    </div>

    <!-- 故事弹窗 -->
    <div class="story-modal" id="storyModal">
        <div class="story-content">
            <h2 class="story-title">📖 见闻记录</h2>
            <p class="story-text" id="storyText"></p>
            <button class="story-close" onclick="closeStoryModal()">关闭</button>
        </div>
    </div>

    <!-- Loading -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p>Agent 正在记录火堆旁的所见所闻...</p>
        </div>
    </div>

    <script>
        // ======== 全局状态 ========
        let isFocusing = false;
        let focusInterval = null;
        let focusRemaining = 0;
        let selectedAction = '烤棉花糖';
        let selectedActionIcon = '🍢';
        let campers = [];

        // ======== 初始化 ========
        const token = localStorage.getItem('campfire_token');
        const userId = localStorage.getItem('campfire_user_id');

        if (token && userId) {
            document.getElementById('loginScreen').classList.add('hidden');
            initApp();
        }

        function goLogin() {
            window.location.href = '/api/login';
        }

        async function initApp() {
            // 更新用户信息
            const userName = localStorage.getItem('campfire_user_name') || '旅者';
            document.getElementById('userName').textContent = userName;
            document.getElementById('userAvatar').textContent = userName.charAt(0);

            // 获取营员数据
            await fetchCampers();

            // 检查专注状态
            await checkFocusStatus();

            // 加载日志
            loadLogs();

            // 自动弹出帮助
            if (!sessionStorage.getItem('guideShown')) {
                setTimeout(() => {
                    alert('欢迎来到数字篝火！\n\n• 点击"开始专注"选择动作\n• 你的 Agent 会代替你社交\n• 点击右侧营员查看见闻记录');
                    sessionStorage.setItem('guideShown', 'true');
                }, 1000);
            }
        }

        // ======== 面板切换 ========
        function toggleLeftPanel() {
            document.getElementById('leftPanel').classList.toggle('collapsed');
        }

        function toggleRightPanel() {
            document.getElementById('rightPanel').classList.toggle('collapsed');
        }

        function setDuration(min) {
            document.getElementById('durationInput').value = min;
        }

        // ======== 核心：开始/停止专注 ========
        function handleFocusClick() {
            if (isFocusing) {
                // 停止专注
                stopFocus();
            } else {
                // 显示动作选择
                document.getElementById('actionModal').classList.add('visible');
            }
        }

        function selectAction(action, icon) {
            selectedAction = action;
            selectedActionIcon = icon;
            document.getElementById('actionModal').classList.remove('visible');
            startFocus();
        }

        async function startFocus() {
            const userId = localStorage.getItem('campfire_user_id');
            const token = localStorage.getItem('campfire_token');
            const duration = parseInt(document.getElementById('durationInput').value) || 25;

            if (!userId) {
                alert('请先登录');
                return;
            }

            try {
                // 调用后端开始专注
                await fetch('/api/focus/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({
                        user_id: parseInt(userId),
                        duration: duration,
                        action: selectedAction,
                        action_icon: selectedActionIcon
                    })
                });

                // 保存状态
                localStorage.setItem('campfire_focus_start', Date.now());
                localStorage.setItem('campfire_focus_duration', duration);
                localStorage.setItem('focusAction', selectedAction);
                localStorage.setItem('focusActionIcon', selectedActionIcon);

                // 启动计时器
                startTimer(duration * 60);

            } catch (e) {
                console.error(e);
                alert('开始专注失败');
            }
        }

        function startTimer(seconds) {
            focusRemaining = seconds;
            isFocusing = true;

            // 更新UI
            updateFocusUI();

            // 启动计时器
            focusInterval = setInterval(() => {
                focusRemaining--;
                updateTimerDisplay();

                if (focusRemaining <= 0) {
                    finishFocus();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(focusRemaining / 60);
            const secs = focusRemaining % 60;
            document.getElementById('timerOverlay').textContent =
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateFocusUI() {
            const btn = document.getElementById('mainFocusBtn');
            const timer = document.getElementById('timerOverlay');
            const hint = document.getElementById('focusHint');

            if (isFocusing) {
                btn.textContent = '停止专注';
                btn.classList.add('stop');
                timer.classList.add('visible');
                hint.classList.add('visible');
                hint.innerHTML = `你的 Agent 正在 ${selectedActionIcon} ${selectedAction}...`;
                document.body.classList.add('focusing');
            } else {
                btn.textContent = '开始专注';
                btn.classList.remove('stop');
                timer.classList.remove('visible');
                hint.classList.remove('visible');
                document.body.classList.remove('focusing');
            }
        }

        // ======== 核心：强制重置 ========
        function forceReset() {
            // 清除计时器
            if (focusInterval) {
                clearInterval(focusInterval);
                focusInterval = null;
            }

            // 重置状态
            isFocusing = false;
            focusRemaining = 0;

            // 清除localStorage
            localStorage.removeItem('campfire_focus_start');
            localStorage.removeItem('campfire_focus_duration');
            localStorage.removeItem('focusAction');
            localStorage.removeItem('focusActionIcon');

            // 更新UI
            updateFocusUI();
        }

        // ======== 停止专注 ========
        async function stopFocus() {
            const userId = localStorage.getItem('campfire_user_id');
            const token = localStorage.getItem('campfire_token');

            try {
                await fetch('/api/focus/end', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ user_id: parseInt(userId), action: selectedAction })
                });
            } catch (e) {
                console.error(e);
            }

            forceReset();
            loadLogs();
        }

        // ======== 专注结束 ========
        async function finishFocus() {
            const userId = localStorage.getItem('campfire_user_id');
            const token = localStorage.getItem('campfire_token');
            const duration = parseInt(localStorage.getItem('campfire_focus_duration')) || 25;

            try {
                const res = await fetch('/api/focus/end', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ user_id: parseInt(userId), action: selectedAction })
                });
                const data = await res.json();

                if (data.story) {
                    showStory(data.story);
                }
            } catch (e) {
                console.error(e);
            }

            forceReset();
            loadLogs();
        }

        // ======== 检查专注状态 ========
        async function checkFocusStatus() {
            const userId = localStorage.getItem('campfire_user_id');
            if (!userId) return;

            const savedStart = localStorage.getItem('campfire_focus_start');
            const savedDuration = localStorage.getItem('campfire_focus_duration');

            // 检查本地是否过期
            if (savedStart && savedDuration) {
                const elapsed = Math.floor((Date.now() - parseInt(savedStart)) / 1000);
                const remaining = parseInt(savedDuration) * 60 - elapsed;

                if (remaining > 0) {
                    // 从后端确认状态
                    try {
                        const res = await fetch(`/api/focus/status?user_id=${userId}`);
                        const data = await res.json();

                        if (data.focusing && data.remaining_seconds > 0) {
                            selectedAction = data.focus_action || '烤棉花糖';
                            selectedActionIcon = data.focus_action_icon || '🍢';
                            startTimer(data.remaining_seconds);
                        } else {
                            forceReset();
                        }
                    } catch (e) {
                        forceReset();
                    }
                } else {
                    forceReset();
                }
            }
        }

        // ======== 加载营员 ========
        async function fetchCampers() {
            try {
                const res = await fetch('/api/campers');
                campers = await res.json();
                renderCampers();
            } catch (e) {
                console.error(e);
            }
        }

        function renderCampers() {
            const container = document.getElementById('campersList');
            if (!campers || campers.length === 0) {
                container.innerHTML = '<div style="color:rgba(255,255,255,0.4);font-size:0.8rem;text-align:center;padding:20px;">暂无营员</div>';
                return;
            }

            container.innerHTML = campers.map(c => {
                const isFocusing = c.status === 'focusing';
                const actionIcon = c.focus_action_icon || '🍢';
                const actionName = c.focus_action || '烤棉花糖';

                return `
                    <div class="camper-item" onclick="generateStory('${c.name}', '${c.mbti || '?'}', ${c.id})">
                        <div class="camper-avatar" style="background:${c.color || '#666'};box-shadow:0 0 8px ${c.color || '#666'}66;">
                            ${c.name.charAt(0)}
                        </div>
                        <div style="flex:1">
                            <div class="camper-name ${isFocusing ? 'focusing' : ''}">${c.name}</div>
                            <div class="camper-status ${isFocusing ? 'focusing' : ''}">
                                ${isFocusing ? `${actionIcon} ${actionName}` : c.mbti || '?'}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ======== 生成见闻故事 ========
        async function generateStory(name, mbti, userId) {
            // 显示Loading
            document.getElementById('loadingOverlay').classList.add('visible');

            try {
                const res = await fetch('/api/story/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mbti_type: mbti, target_user_id: userId })
                });
                const data = await res.json();

                // 隐藏Loading
                document.getElementById('loadingOverlay').classList.remove('visible');

                // 显示故事
                showStory(data.story);
            } catch (e) {
                console.error(e);
                document.getElementById('loadingOverlay').classList.remove('visible');
                alert('生成故事失败');
            }
        }

        function showStory(story) {
            if (!story) {
                alert('暂无故事内容');
                return;
            }
            document.getElementById('storyText').textContent = story;
            document.getElementById('storyModal').classList.add('visible');
        }

        function viewStoryDetail(storyId) {
            // 从缓存的stories中查找
            const story = window.cachedStories?.find(s => s.id === storyId);
            if (story && story.content) {
                showStory(story.content);
            } else {
                // 如果缓存中没有，显示Loading并重新获取
                document.getElementById('loadingOverlay').classList.add('visible');
                fetch('/api/story/logs?limit=50')
                    .then(res => res.json())
                    .then(stories => {
                        document.getElementById('loadingOverlay').classList.remove('visible');
                        const found = stories.find(s => s.id === storyId);
                        if (found && found.content) {
                            showStory(found.content);
                        } else {
                            alert('无法获取故事内容');
                        }
                    })
                    .catch(() => {
                        document.getElementById('loadingOverlay').classList.remove('visible');
                        alert('加载失败');
                    });
            }
        }

        function closeStoryModal() {
            document.getElementById('storyModal').classList.remove('visible');
        }

        // ======== 加载日志 ========
        async function loadLogs() {
            try {
                const res = await fetch('/api/story/logs?limit=20');
                const stories = await res.json();

                // 缓存stories
                window.cachedStories = stories;

                const container = document.getElementById('logsList');
                if (!stories || stories.length === 0) {
                    container.innerHTML = '<div style="color:rgba(255,255,255,0.4);font-size:0.8rem;text-align:center;padding:20px;">暂无故事</div>';
                    return;
                }

                container.innerHTML = stories.map(s => {
                    const date = new Date(s.created_at);
                    const dateStr = `${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${date.getMinutes().toString().padStart(2, '0')}`;
                    const preview = s.content ? s.content.substring(0, 50) + (s.content.length > 50 ? '...' : '') : '暂无内容';
                    return `
                        <div class="log-item" data-story-id="${s.id}" onclick="viewStoryDetail(${s.id})">
                            <div class="log-time">${dateStr} · ${s.duration || 25}分钟</div>
                            <div class="log-preview">${preview}</div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                console.error(e);
            }
        }

        // ======== 创建星空 ========
        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 60 + '%';
                star.style.width = star.style.height = (Math.random() * 2 + 1) + 'px';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.setProperty('--base-opacity', Math.random() * 0.5 + 0.3);
                container.appendChild(star);
            }
        }

        // ======== 定期刷新 ========
        createStars();
        setInterval(fetchCampers, 5000);
    </script>
</body>
</html>
