<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Bonfire - 数字篝火</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030508;
            --bg-center: #0a0e14;
            --fire-inner: #fff7e6;
            --fire-mid: #ffaa00;
            --fire-outer: #ff5500;
            --fire-glow: #ff3300;
            --accent-logic: #00d4ff;
            --accent-creative: #ff6b35;
            --accent-inspiration: #a855f7;
            --accent-order: #22c55e;
            --accent-practice: #f59e0b;
            --text-primary: rgba(255, 255, 255, 0.9);
            --text-secondary: rgba(255, 255, 255, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(ellipse at 50% 120%, #1a0a00 0%, var(--bg-center) 30%, var(--bg-deep) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
            position: relative;
        }

        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
            background: radial-gradient(ellipse at 50% 0%, rgba(30, 20, 50, 0.3) 0%, transparent 60%);
        }

        .star {
            position: absolute; background: white; border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            box-shadow: 0 0 3px white;
        }

        @keyframes twinkle {
            0%, 100% { opacity: var(--base-opacity); transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .header {
            position: absolute; top: 20px; text-align: center; z-index: 100; pointer-events: none;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif; font-size: 1.8rem; font-weight: 700;
            letter-spacing: 8px; color: var(--text-primary);
            text-shadow: 0 0 30px rgba(255, 170, 0, 0.5), 0 0 60px rgba(255, 85, 0, 0.3);
        }

        .header .subtitle { font-size: 0.7rem; color: var(--accent-logic); letter-spacing: 3px; opacity: 0.8; }

        .fire-container {
            position: absolute;
            top: 280px;
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: all 1s ease-in-out;
        }

        .fire-container.zoomed {
            transform: scale(1.5);
        }

        /* 简约火焰 - 旋转椭圆 */
        .flame {
            position: absolute;
            bottom: 20px;
            left: 50%;
            width: 50px;
            height: 50px;
            background: #ff5e00;
            border-radius: 50% 0 50% 50%;
            transform: translateX(-50%) rotate(-45deg);
            filter: blur(4px) contrast(1.5);
            box-shadow:
                0 0 20px #ff5e00,
                0 0 40px #ff5e00,
                0 0 10px #fefcc9 inset;
            animation: burn 0.2s infinite alternate;
        }

        @keyframes burn {
            from { transform: translateX(-50%) rotate(-45deg) scale(1); }
            to { transform: translateX(-50%) rotate(-45deg) scale(1.1) skew(3deg, 3deg); }
        }

        /* 火星粒子 */
        .fire-particle {
            position: absolute;
            bottom: 30px;
            left: 50%;
            width: 4px;
            height: 4px;
            background: #ffcc00;
            border-radius: 50%;
            opacity: 0;
            animation: rise 1.5s infinite ease-out;
        }

        .fire-particle:nth-child(2) { left: 45%; animation-delay: 0.3s; }
        .fire-particle:nth-child(3) { left: 55%; animation-delay: 0.7s; width: 3px; }
        .fire-particle:nth-child(4) { left: 40%; animation-delay: 1.1s; }
        .fire-particle:nth-child(5) { left: 60%; animation-delay: 0.5s; width: 2px; }

        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-150px) translateX(20px) scale(0); opacity: 0; }
        }

        /* 专注模式 - 火焰中心化与放大 */
        .fire-container.focus-active {
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) scale(2.0) !important;
            transition: all 0.8s ease-in-out !important;
            z-index: 50 !important;
        }

        .fire-container.focus-active .flame {
            width: 100px !important;
            height: 100px !important;
            box-shadow:
                0 0 50px #ff5e00,
                0 0 100px #ff5e00,
                0 0 150px #ffaa00,
                0 0 30px #fefcc9 inset !important;
            animation: burn 0.12s infinite alternate !important;
        }

        .fire-container.focus-active .fire-particle {
            animation: rise-intense 0.8s infinite ease-out !important;
            width: 7px !important;
            height: 7px !important;
        }

        @keyframes rise-intense {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-400px) translateX(50px) scale(0); opacity: 0; }
        }

        .fire-container.focus-active .fire-particle:nth-child(2) { animation-delay: 0.1s; }
        .fire-container.focus-active .fire-particle:nth-child(3) { animation-delay: 0.2s; }
        .fire-container.focus-active .fire-particle:nth-child(4) { animation-delay: 0.3s; }
        .fire-container.focus-active .fire-particle:nth-child(5) { animation-delay: 0.15s; }

        /* 专注模式 - 背景加深 */
        body.focus-mode {
            background: radial-gradient(ellipse at 50% 50%, #000000 0%, #000000 70%, #0a0500 100%) !important;
        }

        /* 专注模式 - 隐藏干扰项 (平滑消失) */
        .focus-hide {
            opacity: 0 !important;
            pointer-events: none !important;
            transition: all 0.8s ease !important;
        }

        /* 专注模式 - 倒计时位置重排到火焰下方 */
        .focus-timer.focus-active,
        #timerContainer.focus-active {
            position: fixed !important;
            top: 70% !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            z-index: 100 !important;
            padding: 30px 60px !important;
            background: rgba(0, 0, 0, 0.7) !important;
            border-radius: 24px !important;
            border: 1px solid rgba(34, 197, 94, 0.4) !important;
            backdrop-filter: blur(15px) !important;
            box-shadow: 0 0 40px rgba(34, 197, 94, 0.2) !important;
        }

        .focus-timer.focus-active .focus-timer-display {
            font-size: 5rem !important;
            font-weight: 700 !important;
            color: #22c55e !important;
            text-shadow: 0 0 30px rgba(34, 197, 94, 0.8), 0 0 60px rgba(34, 197, 94, 0.4) !important;
            animation: breathe 2s ease-in-out infinite !important;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        /* 专注时隐藏输入框和开始按钮，显示放弃按钮 */
        .focus-timer.focus-active .focus-duration-input-wrap,
        .focus-timer.focus-active .focus-start-btn {
            display: none !important;
        }

        .focus-timer.focus-active .focus-cancel-btn {
            display: block !important;
            margin-top: 20px !important;
            width: 100%;
            padding: 10px 20px;
            font-size: 12px;
            background: transparent !important;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-secondary);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0.6;
        }

        .focus-timer.focus-active .focus-cancel-btn:hover {
            background: rgba(255, 255, 255, 0.1) !important;
            border-color: rgba(255, 255, 255, 0.4);
            color: rgba(255, 255, 255, 0.9);
            opacity: 1;
        }

        .fire-glow {
            display: none;
        }

        @keyframes pulse-glow { 0%, 100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.1); opacity: 1; } }

        .particle { position: absolute; border-radius: 50%; pointer-events: none; }
        .spark { background: #ffcc00; box-shadow: 0 0 6px #ff6600; }
        .ember { background: #ff4400; box-shadow: 0 0 4px #ff0000; }

        .camper {
            position: absolute; display: flex; flex-direction: column; align-items: center;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; z-index: 20;
        }

        .camper-avatar {
            width: 16px; height: 16px; border-radius: 50%; position: relative;
            transition: all 0.3s ease;
        }

        .camper:hover .camper-avatar { transform: scale(1.5); }

        .camper-avatar::after {
            content: ''; position: absolute; inset: -4px; border-radius: 50%;
            background: inherit; filter: blur(8px); opacity: 0.6; z-index: -1;
        }

        .camper-name {
            color: var(--text-secondary); font-size: 10px; letter-spacing: 2px; margin-top: 8px;
            white-space: nowrap; text-transform: uppercase; transition: all 0.3s ease;
        }

        .camper:hover .camper-name { color: var(--text-primary); text-shadow: 0 0 10px currentColor; }

        .camper-mbti {
            font-size: 9px; color: var(--accent-logic); margin-top: 4px; opacity: 0;
            transition: all 0.3s ease;
        }

        .camper:hover .camper-mbti, .camper.has-activity .camper-mbti { opacity: 1; }

        .camper-activity {
            font-size: 8px; color: var(--fire-mid); margin-top: 2px; opacity: 0;
            background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px;
            transition: all 0.3s ease; white-space: nowrap;
        }

        .camper:hover .camper-activity, .camper.has-activity .camper-activity { opacity: 1; }

        /* 统一侧边栏 */
        .sidebar {
            position: absolute; left: 15px; top: 100px; width: 220px; z-index: 100;
            display: flex; flex-direction: column; gap: 8px;
        }

        /* 右侧 Agents 面板 */
        .right-sidebar {
            position: absolute; right: 15px; top: 100px; width: 200px; z-index: 100;
            display: flex; flex-direction: column; gap: 8px;
        }

        .sidebar-section {
            background: rgba(10, 14, 20, 0.85); border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden; backdrop-filter: blur(10px);
        }

        /* Agents 面板特殊样式 */
        .sidebar-section.agents { border-color: rgba(251, 191, 36, 0.4); }
        .sidebar-section.agents .sidebar-header h3 { color: #fbbf24; }

        /* 说明书面板 */
        .sidebar-section.help { border-color: rgba(255, 255, 255, 0.2); }
        .sidebar-section.help .sidebar-header h3 { color: #fff; }

        .help-content {
            font-size: 10px; color: var(--text-secondary); line-height: 1.6;
            padding: 0 5px 10px;
        }

        .help-content h4 {
            color: var(--text-primary); font-size: 11px; margin: 10px 0 5px;
        }

        .help-content p { margin: 4px 0; }

        .help-content .key {
            display: inline-block; background: rgba(255,255,255,0.1);
            padding: 2px 6px; border-radius: 4px; font-size: 9px; margin: 2px;
        }

        /* 专注模式样式 */
        .sidebar-section.focus { border-color: rgba(34, 197, 94, 0.4); }
        .sidebar-section.focus .sidebar-header h3 { color: #22c55e; }

        .focus-timer {
            text-align: center; padding: 10px 0;
        }

        .focus-timer-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            color: #22c55e;
            text-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
            margin: 10px 0;
        }

        /* 自定义时间输入 */
        .focus-duration-input-wrap {
            display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px;
        }

        .focus-duration-input {
            width: 80px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            text-align: center;
            outline: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .focus-duration-input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(34, 197, 94, 0.6);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.2);
        }

        .focus-duration-input::-webkit-inner-spin-button,
        .focus-duration-input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .focus-duration-unit {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .focus-start-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            width: 100%;
        }

        .focus-start-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
        }

        .focus-start-btn:disabled {
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.3);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .focus-cancel-btn {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ef4444;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 8px;
            width: 100%;
            transition: all 0.3s ease;
        }

        .focus-cancel-btn:hover { background: rgba(239, 68, 68, 0.3); }

        .focus-history {
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
        }

        .focus-history-title {
            font-size: 11px; color: var(--text-secondary);
            margin-bottom: 8px; text-align: center;
        }

        .focus-history-item {
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.15);
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .focus-history-item:hover {
            background: rgba(34, 197, 94, 0.15);
            border-color: rgba(34, 197, 94, 0.3);
        }

        .focus-history-time {
            font-size: 10px; color: var(--text-secondary);
        }

        .focus-history-duration {
            font-size: 11px; color: #22c55e;
            margin-top: 2px;
        }

        /* 专注模式弹窗 */
        .focus-popup {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.5s ease;
        }

        .focus-popup.show { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .focus-popup-content {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .focus-popup-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            color: #22c55e;
            text-align: center;
            margin-bottom: 20px;
        }

        .focus-popup-story {
            font-size: 14px;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.9);
            text-align: left;
            white-space: pre-wrap;
        }

        .focus-popup-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: center;
        }

        .focus-popup-btn {
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .focus-popup-close {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }

        .focus-popup-close:hover { background: rgba(255, 255, 255, 0.2); }

        .focus-popup-share {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none;
            color: white;
        }

        .focus-popup-share:hover {
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
        }

        /* 专注中状态指示 */
        .focusing-indicator {
            display: none;
            position: absolute;
            top: 10px; right: 10px;
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 11px;
            color: #22c55e;
            z-index: 50;
            align-items: center;
            gap: 6px;
        }

        .focusing-indicator.active { display: flex; }

        .focusing-indicator::before {
            content: ''; width: 8px; height: 8px;
            background: #22c55e; border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .agent-item {
            display: flex; align-items: center; gap: 8px; padding: 8px 10px;
            border-radius: 8px; transition: all 0.3s ease; cursor: pointer;
        }

        .agent-item:hover { background: rgba(255, 255, 255, 0.08); }

        .agent-avatar {
            width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: bold;
        }

        .agent-info { flex: 1; min-width: 0; }

        .agent-name {
            font-size: 11px; color: var(--text-primary); white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }

        .agent-mbti {
            font-size: 9px; color: var(--text-secondary);
        }

        .sidebar-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 15px; cursor: pointer;
            transition: background 0.3s ease;
        }

        .sidebar-header:hover { background: rgba(255, 255, 255, 0.05); }

        .sidebar-header h3 {
            font-size: 12px; letter-spacing: 2px; margin: 0;
        }

        .sidebar-toggle {
            font-size: 10px; color: var(--text-secondary); transition: transform 0.3s ease;
        }

        .sidebar-section.collapsed .sidebar-toggle { transform: rotate(-90deg); }
        .sidebar-section.collapsed .sidebar-content { display: none; }

        .sidebar-content { padding: 0 12px 12px; }

        /* MBTI 群组 */
        .sidebar-section.mbti { border-color: rgba(255, 170, 0, 0.3); }
        .sidebar-section.mbti .sidebar-header h3 { color: #ffaa00; }

        .mbti-group {
            margin-bottom: 8px; padding: 8px 10px; border-radius: 8px;
            background: transparent; cursor: pointer; transition: all 0.3s ease;
        }

        .mbti-group:hover { background: rgba(255, 255, 255, 0.08); transform: translateX(3px); }

        .mbti-group-name { font-size: 11px; color: var(--text-primary); margin-bottom: 3px; }
        .mbti-group-members { font-size: 9px; color: var(--text-secondary); }

        /* 状态选择 */
        .sidebar-section.activity { border-color: rgba(0, 212, 255, 0.3); }
        .sidebar-section.activity .sidebar-header h3 { color: #00d4ff; }

        .activity-item {
            display: flex; align-items: center; gap: 8px; padding: 10px; margin-bottom: 6px;
            border-radius: 8px; background: transparent; cursor: pointer;
            transition: all 0.3s ease;
        }

        .activity-item:hover { background: rgba(255, 255, 255, 0.08); }

        .activity-emoji { font-size: 18px; }
        .activity-name { font-size: 11px; color: var(--text-primary); }
        .activity-desc { font-size: 8px; color: var(--text-secondary); }

        .activity-count {
            margin-left: auto; font-size: 10px; color: var(--accent-logic);
            background: rgba(0,212,255,0.2); padding: 2px 6px; border-radius: 10px;
        }

        /* 故事面板 */
        .story-panel {
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
            width: 400px; max-width: 90vw; z-index: 100;
            background: rgba(10, 14, 20, 0.85); padding: 15px 20px; border-radius: 16px;
            border: 1px solid rgba(255, 170, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .story-panel h3 {
            font-size: 11px; color: var(--fire-mid); margin-bottom: 10px; letter-spacing: 2px;
        }
        .story-panel h3 span {
            float: right;
            cursor: pointer;
            color: rgba(255,255,255,0.5);
        }
        .story-panel h3 span:hover {
            color: white;
        }

        .story-content {
            font-size: 12px; color: var(--text-primary); line-height: 1.6;
            font-style: italic;
        }

        .story-refresh {
            margin-top: 10px; padding: 6px 12px; font-size: 10px;
            background: var(--fire-outer); border: none; color: white;
            border-radius: 4px; cursor: pointer; transition: all 0.3s ease;
        }

        .story-refresh:hover { background: var(--fire-mid); }

        /* 日志 - 移到侧边栏 */
        .sidebar-section.logs { border-color: rgba(168, 85, 247, 0.4); }
        .sidebar-section.logs .sidebar-header h3 { color: #a855f7; }

        .log-list {
            max-height: 150px; overflow-y: auto; scrollbar-width: thin;
            scrollbar-color: rgba(168, 85, 247, 0.5) transparent;
        }

        .log-list::-webkit-scrollbar { width: 4px; }
        .log-list::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.5); border-radius: 2px; }

        .log-item {
            padding: 8px; margin-bottom: 6px; border-radius: 8px;
            background: rgba(255,255,255,0.03); cursor: pointer;
            transition: all 0.3s ease;
        }

        .log-item:hover { background: rgba(168, 85, 247, 0.15); transform: translateX(-2px); }

        .log-story {
            font-size: 10px; color: var(--text-primary); line-height: 1.4;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        .log-meta {

<body>

    <!-- 专注中状态指示 -->

    <div class="fire-container" id="campground">
        <div class="fire-glow"></div>

    </div>

    <div class="status" id="status"></div>

    <div class="login-container">
        <button id="loginBtn">开始相遇 (Connect via SecondMe)</button>
    </div>

    <script>
        const campground = document.getElementById('campground');
        const centerX = 50, centerY = 50;
        let currentUser = null;

        // 行为列表
        const activities = [
            { name: "钓鱼", emoji: "🎣", desc: "静心垂钓", mbti: ["INTJ", "INTP", "ISTP", "ISFP"] },
            { name: "煮茶", emoji: "🍵", desc: "品茶论道", mbti: ["INFJ", "INFP", "ENFJ", "ENFP"] },
            { name: "围炉夜话", emoji: "💬", desc: "畅所欲言", mbti: ["ALL"] },
            { name: "烤棉花糖", emoji: "🍡", desc: "甜蜜时光", mbti: ["ESFP", "ISFJ", "ISTJ", "ESTP"] },
            { name: "篝火舞会", emoji: "💃", desc: "尽情起舞", mbti: ["ALL"] },
        ];

        // MBTI 分组
        const mbtiGroups = {
            "智识之火": { color: "#00d4ff", mbtis: ["INTJ", "INTP", "ENTJ", "ENTP"] },
            "灵感之火": { color: "#a855f7", mbtis: ["INFJ", "INFP", "ENFJ", "ENFP"] },
            "秩序之火": { color: "#22c55e", mbtis: ["ISTJ", "ISFJ", "ESTJ", "ESFJ"] },
            "实践之火": { color: "#f59e0b", mbtis: ["ISTP", "ISFP", "ESTP", "ESFP"] },
        };

        document.getElementById('loginBtn').addEventListener('click', () => {
            // 隐藏登录按钮
            const btn = document.getElementById('loginBtn');
            btn.style.opacity = '0';
            btn.style.transform = 'scale(0.8)';
            btn.style.pointerEvents = 'none';

            // 篝火放大
            setTimeout(() => {
                document.getElementById('campground').classList.add('zoomed');
            }, 300);

            // 跳转登录
            window.location.href = '/api/login';
        });

        // 检查 URL 参数（必须在使用 urlParams 之前定义）
        const urlParams = new URLSearchParams(window.location.search);

        // 检查是否已登录，如果是则隐藏按钮并放大篝火
        if (urlParams.get('joined') === 'true') {
            const userId = urlParams.get('user_id');
            const userName = urlParams.get('user_name');
            const token = urlParams.get('token');

            if (token) {
                localStorage.setItem('campfire_token', token);
            }
            if (userId) {
                localStorage.setItem('campfire_user_id', userId);
            }
            if (userName) {
                localStorage.setItem('campfire_user_name', decodeURIComponent(userName));
            }

            // 清除 URL 参数
            window.history.replaceState({}, document.title, window.location.pathname);

            // 直接设置 currentUser，不等待 fetchCampers
            currentUser = {
                id: parseInt(userId),
                name: decodeURIComponent(userName)
            };

            const btn = document.getElementById('loginBtn');
            btn.style.display = 'none';
            document.getElementById('campground').classList.add('zoomed');
            showStatus('欢迎来到数字篝火！请选择一项状态开始');
        }

        function showStatus(msg) {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.classList.add('visible');
            setTimeout(() => status.classList.remove('visible'), 3000);
        }

        function toggleMobileDrawer() {
            document.getElementById('mobileDrawer').classList.toggle('open');
            document.getElementById('mobileDrawerOverlay').classList.toggle('open');
        }

        function showStoryPanel() {
            toggleMobileDrawer();
            document.getElementById('storyPanel').style.display = 'block';
            showStoryLogs();
        }

        function closeStoryPanel() {
            document.getElementById('storyPanel').style.display = 'none';
        }

        function showInstructions() {
            toggleMobileDrawer();
            alert('数字篝火使用说明：\n\n1. 点击"开始相遇"按钮登录\n2. 选择你的状态（钓鱼/煮茶/围炉夜话等）\n3. 与其他用户互动生成故事\n4. 点击篝火中的用户查看信息');
        }

        // ================== 专注模式全局变量 ==================
        let focusInterval = null;           // 倒计时定时器
        let focusRemainingSeconds = 0;      // 剩余秒数
        let focusParticleInterval = null;   // 粒子效果定时器
        let selectedFocusDuration = 25;     // 选中的专注时长
        let isFocusing = false;            // 是否正在专注

        // 页面加载时检查专注状态
        function checkFocusStatus() {
            const userId = localStorage.getItem('campfire_user_id');
            if (!userId) return;

            const savedFocusStart = localStorage.getItem('campfire_focus_start_time');
            const savedFocusDuration = localStorage.getItem('campfire_focus_duration');
            const savedFocusActive = localStorage.getItem('campfire_focus_active');

            if (savedFocusStart && savedFocusDuration) {
                const startTime = parseInt(savedFocusStart);
                const duration = parseInt(savedFocusDuration);
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const remaining = duration * 60 - elapsed;

                if (remaining > 0) {
                    // 恢复专注模式 UI
                    restoreFocusModeUI();

                    // 继续之前的专注
                    startFocusTimer(remaining);
                } else {
                    // 专注时间已过，结束专注
                    endFocus();
                }
            }

            // 获取后端专注状态
            fetch(`/api/focus/status?user_id=${userId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.focusing && data.remaining_seconds > 0) {
                        restoreFocusModeUI();
                        startFocusTimer(data.remaining_seconds);
                    }
                })
                .catch(e => console.error('Failed to get focus status:', e));

            // 加载专注历史
            loadFocusHistory();
        }

        // 恢复专注模式 UI（用于页面刷新后）
        function restoreFocusModeUI() {
            const fireContainer = document.getElementById('campground');
            const timerContainer = document.getElementById('timerContainer');

            // 添加 .focus-active 类到火焰容器
            fireContainer.classList.add('focus-active');

            // 添加 .focus-active 类到计时器
            timerContainer.classList.add('focus-active');

            // 添加 .focus-hide 类隐藏所有干扰项
            document.querySelectorAll('.sidebar, .right-sidebar, .header, .mobile-menu-btn, .login-container, .camper, .story-panel, .focusing-indicator').forEach(el => {
                el.classList.add('focus-hide');
            });

            // 添加 body 沉浸模式类
            document.body.classList.add('focus-mode');

            // 添加额外的粒子效果
            addFocusParticles();
        }

        function selectFocusDuration(minutes) {
            selectedFocusDuration = minutes;
            const durationInput = document.getElementById('focusDuration');
            durationInput.value = minutes;
            updateFocusTimerDisplay(minutes * 60);
        }

        function updateFocusTimerDisplay(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            document.getElementById('timer').textContent =
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        async function startFocus() {
            const userId = localStorage.getItem('campfire_user_id');
            const token = localStorage.getItem('campfire_token');

            if (!userId) {
                alert('请先登录后再开始专注');
                return;
            }

            // 从输入框获取专注时长
            const durationInput = document.getElementById('focusDuration');
            const focusDuration = parseInt(durationInput.value) || 25;
            selectedFocusDuration = focusDuration;

            if (focusDuration < 1 || focusDuration > 180) {
                alert('请输入 1-180 之间的分钟数');
                return;
            }

            // 调用后端 API 开始专注
            try {
                const res = await fetch('/api/focus/start', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        user_id: parseInt(userId),
                        duration: focusDuration
                    })
                });
                const data = await res.json();

                if (data.error) {
                    alert(data.error);
                    return;
                }
            } catch (e) {
                console.error('Focus start error:', e);
            }

            // 保存到 localStorage（用于页面刷新后恢复状态）
            localStorage.setItem('campfire_focus_start_time', Date.now().toString());
            localStorage.setItem('campfire_focus_duration', focusDuration.toString());
            localStorage.setItem('campfire_focus_active', 'true');

            // 添加 .focus-active 类到火焰容器（中心化放大）
            const fireContainer = document.getElementById('campground');
            fireContainer.classList.add('focus-active');

            // 添加 .focus-active 类到计时器（移动到火焰下方）
            const timerContainer = document.getElementById('timerContainer');
            timerContainer.classList.add('focus-active');

            // 添加 .focus-hide 类隐藏所有干扰项
            document.querySelectorAll('.sidebar, .right-sidebar, .header, .mobile-menu-btn, .login-container, .camper, .story-panel, .focusing-indicator').forEach(el => {
                el.classList.add('focus-hide');
            });

            // 添加额外的粒子效果（专注模式）
            addFocusParticles();

            // 开始计时器
            startFocusTimer(focusDuration * 60);

            // 进入沉浸模式
            document.body.classList.add('focus-mode');

            showStatus(`开始专注 ${focusDuration} 分钟`);
        }

        // 添加专注模式额外粒子
        let focusParticleInterval = null;
        function addFocusParticles() {
            const fireContainer = document.getElementById('campground');

            // 立即添加一批粒子
            for (let i = 0; i < 10; i++) {
                createFocusParticle();
            }

            // 持续添加粒子
            focusParticleInterval = setInterval(() => {
                if (isFocusing) {
                    createFocusParticle();
                }
            }, 100);
        }

        function createFocusParticle() {
            const fireContainer = document.getElementById('campground');
            const particle = document.createElement('div');
            particle.className = 'particle focus-spark';
            particle.style.cssText = `
                position: absolute;
                bottom: 30px;
                left: ${45 + Math.random() * 10}%;
                width: ${3 + Math.random() * 4}px;
                height: ${3 + Math.random() * 4}px;
                background: #ffcc00;
                border-radius: 50%;
                box-shadow: 0 0 6px #ff6600;
                pointer-events: none;
                animation: focus-spark-rise ${0.8 + Math.random() * 0.4}s ease-out forwards;
            `;
            fireContainer.appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, 1200);
        }

        // 添加专注粒子动画样式
        const focusStyle = document.createElement('style');
        focusStyle.textContent = `
            @keyframes focus-spark-rise {
                0% { transform: translateY(0) scale(1); opacity: 1; }
                100% { transform: translateY(-350px) translateX(${Math.random() > 0.5 ? '' : '-'}${30 + Math.random() * 30}px) scale(0); opacity: 0; }
            }
        `;
        document.head.appendChild(focusStyle);

        function startFocusTimer(seconds) {
            focusRemainingSeconds = seconds;
            isFocusing = true;

            // CSS focus-mode 会自动处理火焰增强效果
            focusInterval = setInterval(() => {
                focusRemainingSeconds--;
                updateFocusTimerDisplay(focusRemainingSeconds);

                if (focusRemainingSeconds <= 0) {
                    endFocus();
                }
            }, 1000);
        }

        async function endFocus() {
            clearInterval(focusInterval);
            clearInterval(focusParticleInterval);
            focusInterval = null;
            isFocusing = false;

            // 清除专注粒子
            document.querySelectorAll('.focus-spark').forEach(p => p.remove());

            const userId = localStorage.getItem('campfire_user_id');
            const token = localStorage.getItem('campfire_token');

            // 清除 localStorage
            localStorage.removeItem('campfire_focus_start_time');
            localStorage.removeItem('campfire_focus_duration');
            localStorage.removeItem('campfire_focus_active');

            // 移除所有专注模式类
            document.getElementById('campground').classList.remove('focus-active');
            document.querySelector('.focus-timer').classList.remove('focus-active');
            document.querySelectorAll('.focus-hide').forEach(el => {
                el.classList.remove('focus-hide');
            });

            // 退出沉浸模式
            document.body.classList.remove('focus-mode');

            // 重置计时器显示
            const durationInput = document.getElementById('focusDuration');
            updateFocusTimerDisplay((parseInt(durationInput.value) || 25) * 60);

            // 调用后端 API 结束专注，获取故事
            try {
                const res = await fetch('/api/focus/end', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        user_id: parseInt(userId)
                    })
                });
                const data = await res.json();

                if (data.story) {
                    // 显示故事弹窗
                    document.getElementById('focusPopupStory').textContent = data.story;
                    document.getElementById('focusPopup').classList.add('show');
                    showStatus('专注结束！');
                } else {
                    showStatus('专注结束，但故事生成失败');
                }
            } catch (e) {
                console.error('Focus end error:', e);
                showStatus('专注结束');
            }

            // 刷新专注历史
            loadFocusHistory();
        }

        function cancelFocus() {
            // 弹出确认对话框
            if (!confirm("确定要熄灭火堆，放弃这次专注吗？")) {
                return;
            }

            clearInterval(focusInterval);
            clearInterval(focusParticleInterval);
            focusInterval = null;
            isFocusing = false;

            // 清除专注粒子
            document.querySelectorAll('.focus-spark').forEach(p => p.remove());

            // 清除 localStorage
            localStorage.removeItem('campfire_focus_start_time');
            localStorage.removeItem('campfire_focus_duration');
            localStorage.removeItem('campfire_focus_active');

            // 移除所有专注模式类
            document.getElementById('campground').classList.remove('focus-active');
            document.querySelector('.focus-timer').classList.remove('focus-active');
            document.querySelectorAll('.focus-hide').forEach(el => {
                el.classList.remove('focus-hide');
            });

            // 退出沉浸模式
            document.body.classList.remove('focus-mode');

            // 重置计时器显示
            const durationInput = document.getElementById('focusDuration');
            updateFocusTimerDisplay((parseInt(durationInput.value) || 25) * 60);

            showStatus('专注已放弃');
        }

        function closeFocusPopup() {
            document.getElementById('focusPopup').classList.remove('show');
        }

        function shareFocusStory() {
            const story = document.getElementById('focusPopupStory').textContent;
            const text = `🌟 我的数字篝火专注故事\n\n${story}\n\n#数字篝火 #专注 #SecondMe`;

            // 复制到剪贴板
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    showStatus('故事已复制到剪贴板');
                });
            } else {
                // 备用方案
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showStatus('故事已复制到剪贴板');
            }
        }

        async function loadFocusHistory() {
            const userId = localStorage.getItem('campfire_user_id');
            if (!userId) return;

            try {
                const res = await fetch('/api/stories?type=focus_social');
                const data = await res.json();

                const historyContainer = document.getElementById('focusHistory');
                const userStories = data.stories ? data.stories.filter(s => s.user_id == userId) : [];

                if (userStories.length === 0) {
                    historyContainer.innerHTML = '<div class="focus-history-title">暂无专注记录</div>';
                    return;
                }

                let html = '<div class="focus-history-title">专注记录</div>';
                userStories.slice(0, 10).forEach(story => {
                    const date = new Date(story.created_at);
                    const dateStr = `${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${date.getMinutes().toString().padStart(2, '0')}`;
                    html += `
                        <div class="focus-history-item" onclick="showFocusStoryDetail('${story.content.replace(/'/g, "\\'")}')">
                            <div class="focus-history-time">${dateStr}</div>
                            <div class="focus-history-duration">${story.duration} 分钟专注</div>
                        </div>
                    `;
                });
                historyContainer.innerHTML = html;
            } catch (e) {
                console.error('Failed to load focus history:', e);
            }
        }

        function showFocusStoryDetail(story) {
            document.getElementById('focusPopupStory').textContent = story;
            document.getElementById('focusPopup').classList.add('show');
        }

        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 150; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                const size = Math.random() * 2 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.setProperty('--base-opacity', Math.random() * 0.5 + 0.3);
                container.appendChild(star);
            }
        }

        function createParticle(type = 'spark') {
            const particle = document.createElement('div');
            particle.className = 'particle ' + type;
            const size = type === 'spark' ? Math.random() * 3 + 2 : Math.random() * 4 + 2;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';

            const startAngle = Math.random() * Math.PI * 2;
            particle.style.left = (centerX + Math.cos(startAngle) * 20) + 'px';
            particle.style.top = (centerY + Math.sin(startAngle) * 20) + 'px';

            campground.appendChild(particle);

            const angle = Math.random() * Math.PI - Math.PI / 2;
            const velocity = Math.random() * 150 + 100;
            const vx = Math.cos(angle) * velocity, vy = Math.sin(angle) * velocity - 50;

            let x = 0, y = 0, opacity = 1;
            const startTime = performance.now();

            function animate(currentTime) {
                const elapsed = (currentTime - startTime) / 1000;
                x = vx * elapsed; y = vy * elapsed + 0.5 * 200 * elapsed * elapsed;
                opacity = Math.max(0, 1 - elapsed / 2);
                particle.style.transform = `translate(${x}px, ${-y}px)`;
                particle.style.opacity = opacity;
                if (opacity > 0) requestAnimationFrame(animate);
                else particle.remove();
            }
            requestAnimationFrame(animate);
        }

        // Old particle effects removed - using fire-particle CSS instead
        // setInterval(() => createParticle('spark'), 100);
        // setInterval(() => createParticle('ember'), 300);

        async function fetchCampers() {
            try {
                const res = await fetch('/api/campers');
                const data = await res.json();
                renderCampers(data);
                renderMbtiGroups(data);
                renderAgents(data);

                // 尝试通过 /api/me 获取当前用户
                const token = localStorage.getItem('campfire_token');
                if (token) {
                    try {
                        const meRes = await fetch('/api/me', {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const meData = await meRes.json();
                        if (meData.authenticated && meData.user) {
                            currentUser = meData.user;
                            localStorage.setItem('campfire_user_id', currentUser.id);
                        }
                    } catch (e) {
                        console.error('Failed to get /api/me:', e);
                    }
                }

                // 备用：查找本地存储的用户
                if (!currentUser) {
                    const savedUserId = localStorage.getItem('campfire_user_id');
                    const savedUserName = localStorage.getItem('campfire_user_name');
                    if (savedUserId) {
                        // 先尝试从数据中查找
                        const found = data.find(c => c.id == savedUserId);
                        if (found) {
                            currentUser = found;
                        } else {
                            // 如果数据中没有，创建一个临时用户对象
                            currentUser = {
                                id: parseInt(savedUserId),
                                name: savedUserName || 'User'
                            };
                        }
                    } else if (data.length > 0) {
                        currentUser = data[data.length - 1];
                        localStorage.setItem('campfire_user_id', currentUser.id);
                    }
                }
                fetchStatusCounts();
            } catch (e) { console.error(e); }
        }

        async function fetchActivities() {
            try {
                const res = await fetch('/api/status/counts');
                const counts = await res.json();
                renderStatusCounts(counts);
                const hasActivity = Object.values(counts).some(c => c > 0);
                if (hasActivity) document.getElementById('storyPanel').style.display = 'block';
            } catch (e) { console.error(e); }
        }

        function renderCampers(campers) {
            document.querySelectorAll('.camper').forEach(el => el.remove());

            campers.forEach(c => {
                const camper = document.createElement('div');
                camper.className = 'camper';
                if (c.current_activity) camper.classList.add('has-activity');

                const rad = (c.angle * Math.PI) / 180;
                camper.style.left = (centerX + Math.cos(rad) * c.distance - 8) + 'px';
                camper.style.top = (centerY + Math.sin(rad) * c.distance - 8) + 'px';

                const avatar = document.createElement('div');
                avatar.className = 'camper-avatar';
                avatar.style.backgroundColor = c.color;
                avatar.style.boxShadow = `0 0 15px ${c.color}, 0 0 30px ${c.color}66`;

                const name = document.createElement('div');
                name.className = 'camper-name';
                name.textContent = c.name;

                const mbti = document.createElement('div');
                mbti.className = 'camper-mbti';
                mbti.textContent = c.mbti || '?';

                const activity = document.createElement('div');
                activity.className = 'camper-activity';
                activity.textContent = c.current_activity ? `🎯 ${c.current_activity}` : '点击选择状态';

                camper.appendChild(avatar);
                camper.appendChild(name);
                camper.appendChild(mbti);
                camper.appendChild(activity);

                // 点击头像生成故事
                camper.onclick = () => generateStoryForUser(c);

                campground.appendChild(camper);
            });
        }

        function renderMbtiGroups(campers) {
            const container = document.getElementById('mbtiGroups');
            container.innerHTML = '';

            // 统计各组成员
            const groups = { "智识之火": [], "灵感之火": [], "秩序之火": [], "实践之火": [] };
            campers.forEach(c => {
                const group = c.mbti_group || 'misc';
                if (groups[group]) groups[group].push(c);
            });

            // 显示全部4个分组
            Object.entries(groups).forEach(([name, members]) => {
                const div = document.createElement('div');
                div.className = 'mbti-group';
                const groupInfo = mbtiGroups[name] || { color: '#666' };

                // 判断是否是当前用户所在的组
                const isMyGroup = currentUser && currentUser.mbti_group === name;
                const memberNames = members.length > 0 ? members.map(m => m.name).join(' · ') : '暂无成员';

                div.style.border = isMyGroup ? `1px solid ${groupInfo.color}` : '1px solid transparent';
                div.style.background = isMyGroup ? `${groupInfo.color}22` : 'rgba(255,255,255,0.03)';

                div.innerHTML = `
                    <div class="mbti-group-name" style="color: ${groupInfo.color}">${name} ${isMyGroup ? '👈' : ''}</div>
                    <div class="mbti-group-members">${memberNames}</div>
                `;
                div.onclick = () => generateStory(name);
                container.appendChild(div);
            });

            // 渲染移动端 MBTI 分组
            const mobileMbtiContainer = document.getElementById('mobileMbtiSection');
            if (mobileMbtiContainer) {
                mobileMbtiContainer.innerHTML = '<h3>🔥 篝火群组</h3>';
                Object.entries(groups).forEach(([name, members]) => {
                    const div = document.createElement('div');
                    div.style.padding = '5px';
                    div.style.margin = '5px 0';
                    div.style.background = 'rgba(255,255,255,0.05)';
                    div.style.borderRadius = '5px';
                    div.style.fontSize = '12px';
                    div.innerHTML = `<span style="color:var(--fire-mid)">${name}</span>: ${members.length}人`;
                    div.onclick = () => { toggleMobileDrawer(); generateStory(name); };
                    mobileMbtiContainer.appendChild(div);
                });
            }
        }

        // 渲染 Agents 面板
        function renderAgents(campers) {
            const container = document.getElementById('agentsList');
            container.innerHTML = '';

            if (campers.length === 0) {
                container.innerHTML = '<div style="color: var(--text-secondary); font-size: 10px; text-align: center; padding: 10px;">暂无 Agents</div>';
                return;
            }

            // 按群组分类显示
            const groups = { "智识之火": [], "灵感之火": [], "秩序之火": [], "实践之火": [] };
            campers.forEach(c => {
                const group = c.mbti_group || 'misc';
                if (groups[group]) groups[group].push(c);
            });

            Object.entries(groups).forEach(([groupName, members]) => {
                if (members.length === 0) return;

                members.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'agent-item';
                    div.onclick = () => generateStoryForUser(c);

                    const groupColors = {
                        "智识之火": "#00d4ff",
                        "灵感之火": "#a855f7",
                        "秩序之火": "#22c55e",
                        "实践之火": "#f59e0b"
                    };
                    const color = groupColors[groupName] || '#666';

                    div.innerHTML = `
                        <div class="agent-avatar" style="background: ${c.color || color}; box-shadow: 0 0 8px ${c.color || color}66;">
                            ${c.name.charAt(0)}
                        </div>
                        <div class="agent-info">
                            <div class="agent-name">${c.name}</div>
                            <div class="agent-mbti">${c.mbti || '?'} · ${groupName}</div>
                        </div>
                    `;
                    container.appendChild(div);
                });
            });

            // 渲染移动端 Agents
            const mobileAgentsContainer = document.getElementById('mobileAgentsSection');
            if (mobileAgentsContainer) {
                mobileAgentsContainer.innerHTML = '<h3>🤖 在线用户</h3>';
                if (campers.length === 0) {
                    mobileAgentsContainer.innerHTML += '<div style="font-size:12px;color:var(--text-secondary)">暂无用户</div>';
                } else {
                    campers.forEach(c => {
                        const div = document.createElement('div');
                        div.style.padding = '5px';
                        div.style.margin = '5px 0';
                        div.style.background = 'rgba(255,255,255,0.05)';
                        div.style.borderRadius = '5px';
                        div.style.fontSize = '12px';
                        div.innerHTML = `<span style="color:${c.color}">●</span> ${c.name} (${c.mbti})`;
                        mobileAgentsContainer.appendChild(div);
                    });
                }
            }
        }

        function renderActivities(activityList) {
            const container = document.getElementById('activityList');
            container.innerHTML = '';

            activities.forEach(act => {
                const count = activityList.filter(a => a.name === act.name).length;
                const div = document.createElement('div');
                div.className = 'activity-item';
                div.innerHTML = `
                    <span class="activity-emoji">${act.emoji}</span>
                    <div>
                        <div class="activity-name">${act.name}</div>
                        <div class="activity-desc">${act.desc}</div>
                    </div>
                    <span class="activity-count">${count > 0 ? count + '人' : ''}</span>
                `;
                div.onclick = () => joinActivity(act.name);
                container.appendChild(div);
            });
        }

        async function joinActivity(activityName) {
            if (!currentUser) {
                showStatus('请先登录 SecondMe');
                return;
            }
            try {
                // 调用新API：更新用户状态
                await fetch('/api/user/status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUser.id, status: activityName })
                });
                showStatus(`已设置为 ${activityName}！`);
                fetchStatusCounts();
                fetchCampers();
            } catch (e) { showStatus('设置失败'); }
        }

        async function clearActivity() {
            if (!currentUser) {
                showStatus('请先登录 SecondMe');
                return;
            }
            try {
                await fetch('/api/user/status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUser.id, status: '无' })
                });
                showStatus('已清除状态');
                fetchStatusCounts();
                fetchCampers();
            } catch (e) { showStatus('清除失败'); }
        }

        async function fetchStatusCounts() {
            try {
                const res = await fetch('/api/status/counts');
                const counts = await res.json();
                renderStatusCounts(counts);
            } catch (e) { console.error(e); }
        }

        function renderStatusCounts(counts) {
            const container = document.getElementById('activityList');
            container.innerHTML = '';

            activities.forEach(act => {
                const count = counts[act.name] || 0;
                const div = document.createElement('div');
                div.className = 'activity-item';
                const isActive = currentUser && currentUser.current_activity === act.name;
                div.style.border = isActive ? '1px solid var(--fire-mid)' : 'none';
                div.innerHTML = `
                    <span class="activity-emoji">${act.emoji}</span>
                    <div>
                        <div class="activity-name">${act.name}</div>
                        <div class="activity-desc">${act.desc}</div>
                    </div>
                    <span class="activity-count">${count > 0 ? count + '人在做' : ''}</span>
                `;
                div.onclick = () => joinActivity(act.name);
                container.appendChild(div);
            });

            // 添加"无"选项
            const clearDiv = document.createElement('div');
            clearDiv.className = 'activity-item';
            const isCleared = !currentUser || !currentUser.current_activity;
            clearDiv.style.border = isCleared ? '1px solid var(--text-secondary)' : 'none';
            clearDiv.innerHTML = `
                <span class="activity-emoji">❌</span>
                <div>
                    <div class="activity-name">无</div>
                    <div class="activity-desc">清除状态</div>
                </div>
                <span class="activity-count">${counts['无'] > 0 ? counts['无'] + '人' : ''}</span>
            `;
            clearDiv.onclick = () => clearActivity();
            container.appendChild(clearDiv);

            // 渲染移动端状态栏
            renderMobileStatusBar(counts);
        }

        function renderMobileStatusBar(counts) {
            const bar = document.getElementById('mobileStatusBar');
            if (!bar) return;
            bar.innerHTML = '';

            // 添加状态选项
            activities.forEach(act => {
                const count = counts[act.name] || 0;
                const isActive = currentUser && currentUser.current_activity === act.name;
                const item = document.createElement('div');
                item.className = 'mobile-status-item' + (isActive ? ' active' : '');
                item.innerHTML = `${act.emoji} ${act.name} ${count > 0 ? '('+count+')' : ''}`;
                item.onclick = () => joinActivity(act.name);
                bar.appendChild(item);
            });

            // 添加"无"选项
            const clearItem = document.createElement('div');
            const isCleared = !currentUser || !currentUser.current_activity;
            clearItem.className = 'mobile-status-item' + (isCleared ? ' active' : '');
            clearItem.innerHTML = `❌ 无`;
            clearItem.onclick = () => clearActivity();
            bar.appendChild(clearItem);
        }

        // 打字机效果函数
        function typeWriter(element, text, speed = 30) {
            element.textContent = '';
            let i = 0;
            element.dataset.typing = 'true';

            function type() {
                if (element.dataset.typing !== 'true') return;
                if (i < text.length) {
                    element.textContent += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                }
            }
            type();
        }

        // 停止打字机效果
        function stopTypeWriter(element) {
            element.dataset.typing = 'false';
        }

        async function generateStory(groupName) {
            try {
                const mbti = groupName || currentUser?.mbti || 'INTJ';
                const storyContent = document.getElementById('storyContent');

                // 显示加载状态
                stopTypeWriter(storyContent);
                storyContent.textContent = '✨ 故事生成中...';
                document.getElementById('storyPanel').style.display = 'block';

                const res = await fetch('/api/story/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mbti_type: mbti })
                });
                const data = await res.json();

                // 使用打字机效果呈现
                typeWriter(storyContent, data.story, 25);
                fetchStoryLogs(); // 刷新日志
            } catch (e) {
                console.error(e);
                document.getElementById('storyContent').textContent = '故事生成失败，请重试';
            }
        }

        // 为指定用户生成故事（点击头像时调用）
        async function generateStoryForUser(user) {
            if (!user.mbti) {
                showStatus('该用户暂无 MBTI 信息');
                return;
            }
            showStatus(`正在为 ${user.name} 生成故事...`);
            try {
                const res = await fetch('/api/story/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        mbti_type: user.mbti,
                        target_user_id: user.id
                    })
                });
                const data = await res.json();
                const storyContent = document.getElementById('storyContent');

                // 使用打字机效果呈现
                typeWriter(storyContent, data.story, 25);
                document.getElementById('storyPanel').style.display = 'block';
                fetchStoryLogs();
            } catch (e) {
                console.error(e);
                showStatus('生成故事失败');
            }
        }

        // 获取故事日志
        async function fetchStoryLogs() {
            try {
                const res = await fetch('/api/story/logs?limit=30');
                const logs = await res.json();
                renderStoryLogs(logs);
            } catch (e) { console.error(e); }
        }

        // 渲染故事日志
        function renderStoryLogs(logs) {
            const container = document.getElementById('logList');
            container.innerHTML = '';

            if (logs.length === 0) {
                container.innerHTML = '<div style="color: var(--text-secondary); font-size: 10px; text-align: center; padding: 20px;">暂无故事记录</div>';
                return;
            }

            logs.forEach(log => {
                const div = document.createElement('div');
                div.className = 'log-item';
                div.onclick = () => {
                    document.getElementById('storyContent').textContent = log.content;
                    document.getElementById('storyPanel').style.display = 'block';
                };

                const time = new Date(log.created_at).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                const group = log.mbti_group || log.mbti_type || '';

                div.innerHTML = `
                    <div class="log-story">${log.content}</div>
                    <div class="log-meta">
                        <span class="log-group">${group}</span>
                        <span>${time}</span>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // 切换侧边栏章节展开/收起
        function toggleSection(sectionId) {
            const section = document.getElementById(sectionId);
            section.classList.toggle('collapsed');
        }

        createStars();
        fetchCampers();
        fetchStatusCounts();
        fetchStoryLogs();
        checkFocusStatus(); // 检查专注状态

        // 专注时长输入框事件监听
        const focusDurationInput = document.getElementById('focusDuration');
        focusDurationInput.addEventListener('input', function() {
            const value = parseInt(this.value) || 25;
            updateFocusTimerDisplay(value * 60);
        });
        focusDurationInput.addEventListener('change', function() {
            let value = parseInt(this.value) || 25;
            if (value < 1) value = 1;
            if (value > 180) value = 180;
            this.value = value;
            updateFocusTimerDisplay(value * 60);
        });

        setInterval(fetchCampers, 3000);
        setInterval(fetchStatusCounts, 5000);
        setInterval(fetchStoryLogs, 10000); // 每10秒刷新日志
    </script>
</body>
