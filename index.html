<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Bonfire - 数字篝火</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030508;
            --bg-center: #0a0e14;
            --fire-inner: #fff7e6;
            --fire-mid: #ffaa00;
            --fire-outer: #ff5500;
            --fire-glow: #ff3300;
            --accent-logic: #00d4ff;
            --accent-creative: #ff6b35;
            --accent-inspiration: #a855f7;
            --accent-order: #22c55e;
            --accent-practice: #f59e0b;
            --text-primary: rgba(255, 255, 255, 0.9);
            --text-secondary: rgba(255, 255, 255, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(ellipse at 50% 120%, #1a0a00 0%, var(--bg-center) 30%, var(--bg-deep) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
            position: relative;
        }

        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        .star {
            position: absolute; background: white; border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: var(--base-opacity); transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .header {
            position: absolute; top: 20px; text-align: center; z-index: 100; pointer-events: none;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif; font-size: 1.8rem; font-weight: 700;
            letter-spacing: 8px; color: var(--text-primary);
            text-shadow: 0 0 30px rgba(255, 170, 0, 0.5), 0 0 60px rgba(255, 85, 0, 0.3);
        }

        .header .subtitle { font-size: 0.7rem; color: var(--accent-logic); letter-spacing: 3px; opacity: 0.8; }

        .fire-container {
            position: relative; width: 500px; height: 500px;
            display: flex; justify-content: center; align-items: center; z-index: 10;
            transition: all 1s ease-in-out;
        }

        .fire-container.zoomed {
            transform: scale(1.3);
        }

        .flame-layer {
            position: absolute; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            filter: blur(var(--blur)); animation: flicker var(--speed) ease-in-out infinite alternate;
            animation-delay: var(--delay);
        }

        /* 真实火焰渐变效果 */
        .flame-1 {
            width: 25px; height: 40px;
            background: linear-gradient(to top, #fff 0%, #fff7e6 20%, #ffcc00 60%, #ff8800 100%);
            bottom: 35px; --blur: 3px; --speed: 0.08s; --delay: 0s;
            box-shadow: 0 0 20px #fff, 0 0 40px #ffcc00;
        }
        .flame-2 {
            width: 45px; height: 65px;
            background: linear-gradient(to top, #ff8800 0%, #ff6600 30%, #ff4400 70%, #cc2200 100%);
            bottom: 20px; --blur: 6px; --speed: 0.12s; --delay: 0.03s;
            box-shadow: 0 0 30px #ff6600, 0 0 60px #ff440066;
        }
        .flame-3 {
            width: 70px; height: 95px;
            background: linear-gradient(to top, #ff4400 0%, #dd3300 40%, #aa2200 80%, #661100 100%);
            bottom: 5px; --blur: 12px; --speed: 0.18s; --delay: 0.08s;
            box-shadow: 0 0 40px #ff440088, 0 0 80px #aa220044;
        }
        .flame-4 {
            width: 110px; height: 120px;
            background: radial-gradient(ellipse at 50% 80%, #ff4400 0%, #dd3300 30%, #881100 60%, transparent 80%);
            bottom: -15px; --blur: 25px; --speed: 0.25s; --delay: 0.12s;
            box-shadow: 0 0 60px #ff220066, 0 0 120px #aa110033;
        }

        /* 外层火焰光晕 */
        .flame-outer-glow {
            position: absolute;
            width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(255, 100, 0, 0.3) 0%, rgba(255, 50, 0, 0.1) 40%, transparent 70%);
            bottom: -30px;
            animation: pulse-flame 2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse-flame {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        @keyframes flicker {
            0% { transform: translateY(0) scale(1) skewX(0deg); }
            25% { transform: translateY(-2px) scale(1.05) skewX(1deg); }
            50% { transform: translateY(1px) scale(0.98) skewX(-1deg); }
            75% { transform: translateY(-1px) scale(1.02) skewX(0.5deg); }
            100% { transform: translateY(0) scale(1) skewX(0deg); }
        }

        .fire-glow {
            position: absolute; width: 500px; height: 500px;
            background: radial-gradient(ellipse at center bottom, rgba(255, 150, 0, 0.25) 0%, rgba(255, 80, 0, 0.15) 30%, transparent 70%);
            animation: pulse-glow 3s ease-in-out infinite; pointer-events: none;
            box-shadow: 0 0 80px rgba(255, 100, 0, 0.3), inset 0 -20px 60px rgba(255, 50, 0, 0.2);
        }

        @keyframes pulse-glow { 0%, 100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.1); opacity: 1; } }

        .logs { position: absolute; bottom: 0; width: 80px; height: 20px; }
        .log { position: absolute; width: 60px; height: 8px; background: linear-gradient(90deg, #3d2817 0%, #5c3d2e 50%, #3d2817 100%); border-radius: 4px; }
        .log-1 { transform: rotate(-15deg); left: 10px; }
        .log-2 { transform: rotate(15deg); left: 10px; top: 5px; }

        .particle { position: absolute; border-radius: 50%; pointer-events: none; }
        .spark { background: #ffcc00; box-shadow: 0 0 6px #ff6600; }
        .ember { background: #ff4400; box-shadow: 0 0 4px #ff0000; }

        .camper {
            position: absolute; display: flex; flex-direction: column; align-items: center;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; z-index: 20;
        }

        .camper-avatar {
            width: 16px; height: 16px; border-radius: 50%; position: relative;
            transition: all 0.3s ease;
        }

        .camper:hover .camper-avatar { transform: scale(1.5); }

        .camper-avatar::after {
            content: ''; position: absolute; inset: -4px; border-radius: 50%;
            background: inherit; filter: blur(8px); opacity: 0.6; z-index: -1;
        }

        .camper-name {
            color: var(--text-secondary); font-size: 10px; letter-spacing: 2px; margin-top: 8px;
            white-space: nowrap; text-transform: uppercase; transition: all 0.3s ease;
        }

        .camper:hover .camper-name { color: var(--text-primary); text-shadow: 0 0 10px currentColor; }

        .camper-mbti {
            font-size: 9px; color: var(--accent-logic); margin-top: 4px; opacity: 0;
            transition: all 0.3s ease;
        }

        .camper:hover .camper-mbti, .camper.has-activity .camper-mbti { opacity: 1; }

        .camper-activity {
            font-size: 8px; color: var(--fire-mid); margin-top: 2px; opacity: 0;
            background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px;
            transition: all 0.3s ease; white-space: nowrap;
        }

        .camper:hover .camper-activity, .camper.has-activity .camper-activity { opacity: 1; }

        /* MBTI 分组区域 */
        .mbti-panel {
            position: absolute; left: 20px; top: 100px; width: 200px; z-index: 100;
            background: rgba(10, 14, 20, 0.85); padding: 15px; border-radius: 12px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
        }

        .mbti-panel h3 {
            font-size: 12px; color: var(--text-primary); margin-bottom: 10px;
            letter-spacing: 2px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;
        }

        .mbti-group {
            margin-bottom: 12px; padding: 8px; border-radius: 8px;
            background: rgba(255,255,255,0.03); cursor: pointer; transition: all 0.3s ease;
        }

        .mbti-group:hover { background: rgba(255,255,255,0.08); }

        .mbti-group-name { font-size: 11px; color: var(--text-primary); margin-bottom: 4px; }
        .mbti-group-members { font-size: 9px; color: var(--text-secondary); }

        /* 行为选择面板 */
        .activity-panel {
            position: absolute; right: 20px; top: 100px; width: 220px; z-index: 100;
            background: rgba(10, 14, 20, 0.85); padding: 15px; border-radius: 12px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
        }

        .activity-panel h3 {
            font-size: 12px; color: var(--text-primary); margin-bottom: 10px;
            letter-spacing: 2px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;
        }

        .activity-item {
            display: flex; align-items: center; gap: 8px; padding: 10px; margin-bottom: 8px;
            border-radius: 8px; background: rgba(255,255,255,0.03); cursor: pointer;
            transition: all 0.3s ease;
        }

        .activity-item:hover { background: rgba(255,255,255,0.08); transform: translateX(-3px); }

        .activity-emoji { font-size: 20px; }
        .activity-name { font-size: 12px; color: var(--text-primary); }
        .activity-desc { font-size: 9px; color: var(--text-secondary); }

        .activity-count {
            margin-left: auto; font-size: 10px; color: var(--accent-logic);
            background: rgba(0,212,255,0.2); padding: 2px 6px; border-radius: 10px;
        }

        /* 故事面板 */
        .story-panel {
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
            width: 400px; max-width: 90vw; z-index: 100;
            background: rgba(10, 14, 20, 0.9); padding: 15px 20px; border-radius: 12px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,170,0,0.3);
        }

        .story-panel h3 {
            font-size: 11px; color: var(--fire-mid); margin-bottom: 10px; letter-spacing: 2px;
        }

        .story-content {
            font-size: 12px; color: var(--text-primary); line-height: 1.6;
            font-style: italic;
        }

        .story-refresh {
            margin-top: 10px; padding: 6px 12px; font-size: 10px;
            background: var(--fire-outer); border: none; color: white;
            border-radius: 4px; cursor: pointer; transition: all 0.3s ease;
        }

        .story-refresh:hover { background: var(--fire-mid); }

        /* 登录按钮 */
        .login-container {
            position: absolute; bottom: 30px; z-index: 100; text-align: center;
        }

        #loginBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none; color: white; padding: 16px 35px; border-radius: 50px;
            cursor: pointer; font-weight: 500; font-size: 15px; letter-spacing: 2px;
            transition: all 0.3s ease; box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
            font-family: 'Noto Sans SC', sans-serif;
        }

        #loginBtn:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(102, 126, 234, 0.6); }

        .status {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: var(--text-secondary); font-size: 14px; opacity: 0;
            transition: opacity 0.3s ease; pointer-events: none; z-index: 200;
        }

        .status.visible { opacity: 1; }

        .connection-line {
            position: absolute; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 170, 0, 0.3), transparent);
            transform-origin: left center; pointer-events: none; z-index: 5;
        }

        @media (max-width: 768px) {
            .mbti-panel, .activity-panel { display: none; }
            .fire-container { width: 350px; height: 350px; }
            .header h1 { font-size: 1.2rem; letter-spacing: 4px; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="header">
        <h1>DIGITAL BONFIRE</h1>
        <p class="subtitle">◈ MBTI 篝火社群 ◈</p>
    </div>

    <!-- MBTI 分组 -->
    <div class="mbti-panel" id="mbtiPanel">
        <h3>🔥 篝火群组</h3>
        <div id="mbtiGroups"></div>
    </div>

    <!-- 行为选择 -->
    <div class="activity-panel" id="activityPanel">
        <h3>🎯 选择状态</h3>
        <div id="activityList"></div>
    </div>

    <!-- 故事面板 -->
    <div class="story-panel" id="storyPanel" style="display: none;">
        <h3>📖 篝火故事</h3>
        <p class="story-content" id="storyContent"></p>
        <button class="story-refresh" onclick="generateStory()">换一换</button>
    </div>

    <div class="fire-container" id="campground">
        <div class="fire-glow"></div>
        <div class="flame-outer-glow"></div>
        <div class="flame-layer flame-1"></div>
        <div class="flame-layer flame-2"></div>
        <div class="flame-layer flame-3"></div>
        <div class="flame-layer flame-4"></div>
        <div class="logs">
            <div class="log log-1"></div>
            <div class="log log-2"></div>
        </div>
    </div>

    <div class="status" id="status"></div>

    <div class="login-container">
        <button id="loginBtn">开始相遇 (Connect via SecondMe)</button>
    </div>

    <script>
        const campground = document.getElementById('campground');
        const centerX = 250, centerY = 230;
        let currentUser = null;

        // 行为列表
        const activities = [
            { name: "钓鱼", emoji: "🎣", desc: "静心垂钓", mbti: ["INTJ", "INTP", "ISTP", "ISFP"] },
            { name: "煮茶", emoji: "🍵", desc: "品茶论道", mbti: ["INFJ", "INFP", "ENFJ", "ENFP"] },
            { name: "围炉夜话", emoji: "💬", desc: "畅所欲言", mbti: ["ALL"] },
            { name: "烤棉花糖", emoji: "🍡", desc: "甜蜜时光", mbti: ["ESFP", "ISFJ", "ISTJ", "ESTP"] },
            { name: "篝火舞会", emoji: "💃", desc: "尽情起舞", mbti: ["ALL"] },
        ];

        // MBTI 分组
        const mbtiGroups = {
            "智识之火": { color: "#00d4ff", mbtis: ["INTJ", "INTP", "ENTJ", "ENTP"] },
            "灵感之火": { color: "#a855f7", mbtis: ["INFJ", "INFP", "ENFJ", "ENFP"] },
            "秩序之火": { color: "#22c55e", mbtis: ["ISTJ", "ISFJ", "ESTJ", "ESFJ"] },
            "实践之火": { color: "#f59e0b", mbtis: ["ISTP", "ISFP", "ESTP", "ESFP"] },
        };

        document.getElementById('loginBtn').addEventListener('click', () => {
            // 隐藏登录按钮
            const btn = document.getElementById('loginBtn');
            btn.style.opacity = '0';
            btn.style.transform = 'scale(0.8)';
            btn.style.pointerEvents = 'none';

            // 篝火放大
            setTimeout(() => {
                document.getElementById('campground').classList.add('zoomed');
            }, 300);

            // 跳转登录
            window.location.href = '/api/login';
        });

        // 检查 URL 参数（必须在使用 urlParams 之前定义）
        const urlParams = new URLSearchParams(window.location.search);

        // 检查是否已登录，如果是则隐藏按钮并放大篝火
        if (urlParams.get('joined') === 'true') {
            const btn = document.getElementById('loginBtn');
            btn.style.display = 'none';
            document.getElementById('campground').classList.add('zoomed');
            showStatus('欢迎来到数字篝火！请选择一项状态开始');
        }

        function showStatus(msg) {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.classList.add('visible');
            setTimeout(() => status.classList.remove('visible'), 3000);
        }

        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 150; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                const size = Math.random() * 2 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.setProperty('--base-opacity', Math.random() * 0.5 + 0.3);
                container.appendChild(star);
            }
        }

        function createParticle(type = 'spark') {
            const particle = document.createElement('div');
            particle.className = 'particle ' + type;
            const size = type === 'spark' ? Math.random() * 3 + 2 : Math.random() * 4 + 2;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';

            const startAngle = Math.random() * Math.PI * 2;
            particle.style.left = (centerX + Math.cos(startAngle) * 20) + 'px';
            particle.style.top = (centerY + Math.sin(startAngle) * 20) + 'px';

            campground.appendChild(particle);

            const angle = Math.random() * Math.PI - Math.PI / 2;
            const velocity = Math.random() * 150 + 100;
            const vx = Math.cos(angle) * velocity, vy = Math.sin(angle) * velocity - 50;

            let x = 0, y = 0, opacity = 1;
            const startTime = performance.now();

            function animate(currentTime) {
                const elapsed = (currentTime - startTime) / 1000;
                x = vx * elapsed; y = vy * elapsed + 0.5 * 200 * elapsed * elapsed;
                opacity = Math.max(0, 1 - elapsed / 2);
                particle.style.transform = `translate(${x}px, ${-y}px)`;
                particle.style.opacity = opacity;
                if (opacity > 0) requestAnimationFrame(animate);
                else particle.remove();
            }
            requestAnimationFrame(animate);
        }

        setInterval(() => createParticle('spark'), 100);
        setInterval(() => createParticle('ember'), 300);

        async function fetchCampers() {
            try {
                const res = await fetch('/api/campers');
                const data = await res.json();
                renderCampers(data);
                renderMbtiGroups(data);
                // 找到当前登录用户（根据 localStorage 或最后一个登录的）
                const savedUserId = localStorage.getItem('campfire_user_id');
                if (savedUserId) {
                    currentUser = data.find(c => c.id == savedUserId);
                } else if (data.length > 0) {
                    currentUser = data[data.length - 1];
                    localStorage.setItem('campfire_user_id', currentUser.id);
                }
                fetchStatusCounts();
            } catch (e) { console.error(e); }
        }

        async function fetchActivities() {
            try {
                const res = await fetch('/api/status/counts');
                const counts = await res.json();
                renderStatusCounts(counts);
                const hasActivity = Object.values(counts).some(c => c > 0);
                if (hasActivity) document.getElementById('storyPanel').style.display = 'block';
            } catch (e) { console.error(e); }
        }

        function renderCampers(campers) {
            document.querySelectorAll('.camper').forEach(el => el.remove());
            document.querySelectorAll('.connection-line').forEach(el => el.remove());

            campers.forEach(c => {
                const camper = document.createElement('div');
                camper.className = 'camper';
                if (c.current_activity) camper.classList.add('has-activity');

                const rad = (c.angle * Math.PI) / 180;
                camper.style.left = (centerX + Math.cos(rad) * c.distance - 8) + 'px';
                camper.style.top = (centerY + Math.sin(rad) * c.distance - 8) + 'px';

                const avatar = document.createElement('div');
                avatar.className = 'camper-avatar';
                avatar.style.backgroundColor = c.color;
                avatar.style.boxShadow = `0 0 15px ${c.color}, 0 0 30px ${c.color}66`;

                const name = document.createElement('div');
                name.className = 'camper-name';
                name.textContent = c.name;

                const mbti = document.createElement('div');
                mbti.className = 'camper-mbti';
                mbti.textContent = c.mbti || '?';

                const activity = document.createElement('div');
                activity.className = 'camper-activity';
                activity.textContent = c.current_activity ? `🎯 ${c.current_activity}` : '点击选择状态';

                camper.appendChild(avatar);
                camper.appendChild(name);
                camper.appendChild(mbti);
                camper.appendChild(activity);
                campground.appendChild(camper);

                // 连接线
                const line = document.createElement('div');
                line.className = 'connection-line';
                line.style.width = c.distance + 'px';
                line.style.left = centerX + 'px';
                line.style.top = centerY + 'px';
                line.style.transform = `rotate(${c.angle}deg)`;
                campground.insertBefore(line, campground.firstChild);
            });
        }

        function renderMbtiGroups(campers) {
            const container = document.getElementById('mbtiGroups');
            container.innerHTML = '';

            // 统计各组成员
            const groups = { "智识之火": [], "灵感之火": [], "秩序之火": [], "实践之火": [] };
            campers.forEach(c => {
                const group = c.mbti_group || 'misc';
                if (groups[group]) groups[group].push(c);
            });

            // 显示全部4个分组
            Object.entries(groups).forEach(([name, members]) => {
                const div = document.createElement('div');
                div.className = 'mbti-group';
                const groupInfo = mbtiGroups[name] || { color: '#666' };

                // 判断是否是当前用户所在的组
                const isMyGroup = currentUser && currentUser.mbti_group === name;
                const memberNames = members.length > 0 ? members.map(m => m.name).join(' · ') : '暂无成员';

                div.style.border = isMyGroup ? `1px solid ${groupInfo.color}` : '1px solid transparent';
                div.style.background = isMyGroup ? `${groupInfo.color}22` : 'rgba(255,255,255,0.03)';

                div.innerHTML = `
                    <div class="mbti-group-name" style="color: ${groupInfo.color}">${name} ${isMyGroup ? '👈' : ''}</div>
                    <div class="mbti-group-members">${memberNames}</div>
                `;
                div.onclick = () => generateStory(name);
                container.appendChild(div);
            });
        }

        function renderActivities(activityList) {
            const container = document.getElementById('activityList');
            container.innerHTML = '';

            activities.forEach(act => {
                const count = activityList.filter(a => a.name === act.name).length;
                const div = document.createElement('div');
                div.className = 'activity-item';
                div.innerHTML = `
                    <span class="activity-emoji">${act.emoji}</span>
                    <div>
                        <div class="activity-name">${act.name}</div>
                        <div class="activity-desc">${act.desc}</div>
                    </div>
                    <span class="activity-count">${count > 0 ? count + '人' : ''}</span>
                `;
                div.onclick = () => joinActivity(act.name);
                container.appendChild(div);
            });
        }

        async function joinActivity(activityName) {
            if (!currentUser) {
                showStatus('请先登录 SecondMe');
                return;
            }
            try {
                // 调用新API：更新用户状态
                await fetch('/api/user/status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUser.id, status: activityName })
                });
                showStatus(`已设置为 ${activityName}！`);
                fetchStatusCounts();
                fetchCampers();
            } catch (e) { showStatus('设置失败'); }
        }

        async function clearActivity() {
            if (!currentUser) {
                showStatus('请先登录 SecondMe');
                return;
            }
            try {
                await fetch('/api/user/status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUser.id, status: '无' })
                });
                showStatus('已清除状态');
                fetchStatusCounts();
                fetchCampers();
            } catch (e) { showStatus('清除失败'); }
        }

        async function fetchStatusCounts() {
            try {
                const res = await fetch('/api/status/counts');
                const counts = await res.json();
                renderStatusCounts(counts);
            } catch (e) { console.error(e); }
        }

        function renderStatusCounts(counts) {
            const container = document.getElementById('activityList');
            container.innerHTML = '';

            activities.forEach(act => {
                const count = counts[act.name] || 0;
                const div = document.createElement('div');
                div.className = 'activity-item';
                const isActive = currentUser && currentUser.current_activity === act.name;
                div.style.border = isActive ? '1px solid var(--fire-mid)' : 'none';
                div.innerHTML = `
                    <span class="activity-emoji">${act.emoji}</span>
                    <div>
                        <div class="activity-name">${act.name}</div>
                        <div class="activity-desc">${act.desc}</div>
                    </div>
                    <span class="activity-count">${count > 0 ? count + '人在做' : ''}</span>
                `;
                div.onclick = () => joinActivity(act.name);
                container.appendChild(div);
            });

            // 添加"无"选项
            const clearDiv = document.createElement('div');
            clearDiv.className = 'activity-item';
            const isCleared = !currentUser || !currentUser.current_activity;
            clearDiv.style.border = isCleared ? '1px solid var(--text-secondary)' : 'none';
            clearDiv.innerHTML = `
                <span class="activity-emoji">❌</span>
                <div>
                    <div class="activity-name">无</div>
                    <div class="activity-desc">清除状态</div>
                </div>
                <span class="activity-count">${counts['无'] > 0 ? counts['无'] + '人' : ''}</span>
            `;
            clearDiv.onclick = () => clearActivity();
            container.appendChild(clearDiv);
        }

        async function generateStory(groupName) {
            try {
                const mbti = groupName || currentUser?.mbti || 'INTJ';
                const res = await fetch('/api/story/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mbti_type: mbti })
                });
                const data = await res.json();
                document.getElementById('storyContent').textContent = data.story;
                document.getElementById('storyPanel').style.display = 'block';
            } catch (e) { console.error(e); }
        }

        createStars();
        fetchCampers();
        fetchStatusCounts();
        setInterval(fetchCampers, 3000);
        setInterval(fetchStatusCounts, 5000);
    </script>
</body>
</html>
